name: CI

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
        with:
          # Pin to the version declared in biome.json / package-lock (2.3.14).
          # `latest` drifts (e.g. 2.5.5 reformats it.each blocks), failing CI on
          # files formatted with the pinned local version.
          version: 2.3.14
      - run: biome ci .

  skill-eval-annotation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Annotate skill changes lacking eval evidence
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node scripts/check-skill-eval-annotation.js
      - name: Annotate rubric edits lacking a version bump
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-eval-version-bump.js

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
      - run: npm ci
      - run: pip install pytest pyyaml
      - run: npm run check:versions
      - run: npm run check:docs
      - run: npm run check:cli-consumers
      - run: npm run check:hooks
      - run: npm run check:eval-targets
      - run: npm run check:product
      - run: npm run test:scripts
      - run: npm run test:hooks
      - run: npm run test:node
      - run: npm run test:skills
      - run: npm run test:observer-daemon
